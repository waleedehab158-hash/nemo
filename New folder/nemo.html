<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ملكة جمال المعادي 👑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#04162b; --bg2:#072a50;
    --sky2:#cdeeff; --gold-soft:#f3dca0;
    --blue-bright:#4fb3d8; --green-eye:#7ecfb0;
    --white:#f7fcff; --star:#fff8dc;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    width:100%;height:100%;overflow:hidden;
    font-family:'Tajawal',sans-serif;color:var(--white);
    background:linear-gradient(170deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg1) 100%);
  }

  /* hearts bg */
  #hearts-bg{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden;}
  .heart{position:absolute;bottom:-10%;transform:rotate(45deg);opacity:0;}
  .heart::before,.heart::after{content:"";position:absolute;width:100%;height:100%;border-radius:50%;}
  .heart::before{left:-50%;}.heart::after{top:-50%;}
  @keyframes floatUp{
    0%{transform:translateY(0) rotate(45deg) scale(.6);opacity:0;}
    10%{opacity:.85;}85%{opacity:.4;}
    100%{transform:translateY(-115vh) rotate(45deg) scale(1);opacity:0;}
  }
  .star-dot{position:absolute;border-radius:50%;background:var(--star);box-shadow:0 0 5px 1px var(--star);opacity:0;pointer-events:none;}
  @keyframes starTwinkle{0%,100%{opacity:0;transform:scale(.4);}50%{opacity:.9;transform:scale(1.3);}}

  .moon{
    position:fixed;top:4%;left:5%;width:56px;height:56px;border-radius:50%;
    background:radial-gradient(circle at 38% 38%,#fffde0,#f0e8a0 55%,#d4c870 100%);
    box-shadow:0 0 40px 14px rgba(240,232,160,.25);
    animation:moonGlow 5s ease-in-out infinite;z-index:3;
  }
  @keyframes moonGlow{0%,100%{box-shadow:0 0 40px 14px rgba(240,232,160,.25);}50%{box-shadow:0 0 60px 22px rgba(240,232,160,.4);}}

  .stage{
    position:relative;width:100vw;height:100vh;
    display:flex;align-items:center;justify-content:center;z-index:1;
  }

  /* ===== LOCK CARD ===== */
  .card{
    position:relative;z-index:5;width:min(420px,88vw);
    padding:44px 34px 36px;text-align:center;border-radius:28px;
    background:linear-gradient(155deg,rgba(7,42,80,.82),rgba(4,22,43,.9));
    border:1.5px solid rgba(168,216,240,.3);
    box-shadow:0 30px 60px -18px rgba(0,0,0,.65),0 0 80px -10px rgba(79,179,216,.25);
    backdrop-filter:blur(8px);
    transition:opacity .7s ease,transform .7s ease,filter .7s ease;
  }
  .card.hide{opacity:0;transform:scale(.84) translateY(-14px);filter:blur(9px);pointer-events:none;}
  .lock-emblem{width:78px;height:78px;margin:0 auto 16px;animation:pulseLock 2.5s ease-in-out infinite;}
  @keyframes pulseLock{0%,100%{transform:scale(1);}50%{transform:scale(1.09);}}
  .card h1{font-family:'Aref Ruqaa',serif;font-size:clamp(21px,5vw,29px);font-weight:700;color:var(--sky2);text-shadow:0 0 22px rgba(168,216,240,.55);margin-bottom:6px;}
  .card p.sub{font-size:13px;font-weight:300;color:rgba(247,252,255,.55);margin-bottom:24px;}
  .pw-wrap{margin-bottom:8px;}
  .pw-wrap input{
    width:100%;padding:14px 16px;font-size:21px;letter-spacing:6px;text-align:center;
    border-radius:14px;border:1.5px solid rgba(168,216,240,.4);
    background:rgba(255,255,255,.07);color:var(--white);outline:none;
    font-family:'Tajawal',sans-serif;transition:border-color .3s,box-shadow .3s;
  }
  .pw-wrap input::placeholder{letter-spacing:2px;font-size:14px;color:rgba(247,252,255,.3);}
  .pw-wrap input:focus{border-color:var(--blue-bright);box-shadow:0 0 0 4px rgba(79,179,216,.16);}
  .pw-wrap input.shake{animation:shake .45s ease;}
  @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(7px);}60%{transform:translateX(-5px);}80%{transform:translateX(4px);}}
  .hint{margin-top:12px;font-size:12px;color:rgba(247,252,255,.4);min-height:16px;}

  /* ===== REVEAL — two columns: text LEFT, photo RIGHT ===== */
  .reveal{
    position:absolute;z-index:6;
    width:min(700px,96vw);max-height:92vh;
    opacity:0;pointer-events:none;
    transform:translateY(16px);
    transition:opacity .85s ease,transform .85s ease;
    display:flex;flex-direction:row;
    align-items:flex-start;
    gap:16px;
    padding:0 10px;
    overflow:hidden;
  }
  .reveal.show{opacity:1;pointer-events:auto;transform:translateY(0);}

  /* --- LEFT: text --- */
  .text-col{
    flex:1;min-width:0;
    display:flex;flex-direction:column;
    align-items:flex-end;
    overflow-y:auto;max-height:92vh;
    scrollbar-width:none;padding-right:4px;
  }
  .text-col::-webkit-scrollbar{display:none;}

  .crown-icon{
    font-size:42px;display:inline-block;
    animation:floatCrown 2.6s ease-in-out infinite;
    filter:drop-shadow(0 0 16px rgba(230,194,114,.7));
    margin-bottom:6px;align-self:center;
  }
  @keyframes floatCrown{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-8px) rotate(4deg);}}

  .lines{display:flex;flex-direction:column;gap:9px;align-items:flex-end;width:100%;}

  .line{
    font-family:'Aref Ruqaa',serif;
    font-size:clamp(15px,3.8vw,22px);
    color:var(--white);
    text-shadow:0 2px 6px rgba(0,0,0,.7);
  }
  .line .txt{
    display:inline-block;
    border-left:3px solid var(--sky2);
    padding-left:6px;white-space:nowrap;
  }
  .line.sky  .txt{color:var(--sky2);}
  .line.gold .txt{color:var(--gold-soft);}
  .line.green .txt{color:var(--green-eye);}
  .line.star .txt{color:var(--star);}

  .sep{width:0;height:1.5px;background:linear-gradient(90deg,transparent,var(--blue-bright),transparent);margin:8px auto;transition:width 1s ease;align-self:center;}
  .sep.show{width:160px;}

  .signature{
    margin-top:12px;align-self:center;
    font-family:'Aref Ruqaa',serif;
    font-size:0;opacity:0;
    transform:translateY(10px) scale(.9);
    transition:opacity 1s ease,transform 1s ease;
    color:var(--gold-soft);text-align:center;
    text-shadow:0 2px 6px rgba(0,0,0,.7);
  }
  .signature.show{opacity:1;font-size:clamp(16px,3.6vw,20px);transform:translateY(0) scale(1);}
  .signature .dash{display:block;width:50px;height:1.5px;margin:0 auto 8px;background:linear-gradient(90deg,transparent,var(--gold-soft),transparent);}
  .signature .h-ico{color:var(--blue-bright);margin-right:4px;display:inline-block;animation:pulseLock 1.7s ease-in-out infinite;}

  /* --- RIGHT: photo box --- */
  .photo-col{
    flex-shrink:0;
    width:min(200px, 42vw);
    display:flex;align-items:center;justify-content:center;
  }

  .photo-box{
    width:100%;
    border-radius:18px;
    overflow:hidden;
    border:3px solid rgba(168,216,240,.45);
    box-shadow:0 0 30px -4px rgba(79,179,216,.5),0 12px 30px -10px rgba(0,0,0,.6);
    opacity:0;transform:scale(.75) translateX(20px);
    transition:opacity 1s ease,transform 1s ease;
  }
  .photo-box.show{opacity:1;transform:scale(1) translateX(0);}
  .photo-box img{width:100%;height:auto;display:block;object-fit:cover;}

  /* burst */
  .burst-el{position:fixed;z-index:7;pointer-events:none;opacity:0;}
  @keyframes burstFly{0%{opacity:0;transform:translate(0,0) scale(.3) rotate(0deg);}15%{opacity:1;}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(1.1) rotate(var(--rot));}}

  /* music btn */
  #muteBtn{
    position:fixed;top:18px;right:18px;z-index:50;
    width:44px;height:44px;border-radius:50%;
    border:1.5px solid rgba(168,216,240,.4);
    background:rgba(4,22,43,.7);
    color:var(--sky2);font-size:19px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;backdrop-filter:blur(5px);transition:transform .25s;
  }
  #muteBtn:hover{transform:scale(1.08);}
  #muteBtn.playing{animation:pulseLock 1.9s ease-in-out infinite;}

  @media(max-width:420px){
    .reveal{gap:10px;}
    .photo-col{width:min(155px,40vw);}
    .line{font-size:14px;}
  }
</style>
</head>
<body>

<div id="hearts-bg"></div>
<div class="moon"></div>
<audio id="bgMusic" src="song.mp3" preload="auto"></audio>
<button id="muteBtn">🔇</button>

<div class="stage">

  <!-- LOCK CARD -->
  <div class="card" id="card">
    <div class="lock-emblem">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="78" height="78">
        <defs><linearGradient id="hg2" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#cdeeff"/>
          <stop offset="50%" stop-color="#4fb3d8"/>
          <stop offset="100%" stop-color="#e6c272"/>
        </linearGradient></defs>
        <path d="M50 90 C18 66 3 45 3 26 C3 11 16 1 30 1 C40 1 47 7 50 16 C53 7 60 1 70 1 C84 1 97 11 97 26 C97 45 82 66 50 90 Z" fill="url(#hg2)"/>
        <circle cx="50" cy="44" r="11" fill="#04162b" opacity=".8"/>
        <circle cx="50" cy="44" r="4" fill="#e6c272"/>
        <rect x="47" y="48" width="6" height="8" rx="2" fill="#e6c272"/>
      </svg>
    </div>
    <h1>فيه رسالة مستنياكِ 👑</h1>
    <p class="sub">اكتبي كلمة السر عشان تفتحيها 🔐</p>
    <div class="pw-wrap">
      <input type="password" id="pwInput" inputmode="numeric"
             placeholder="• • • • • • •" autocomplete="off" maxlength="9">
    </div>
    <div class="hint" id="hint"></div>
  </div>

  <!-- REVEAL: text right (RTL = right) + photo left (RTL = left) -->
  <div class="reveal" id="reveal">

    <!-- TEXT (RTL: shows on right) -->
    <div class="text-col" id="textCol">
      <div class="crown-icon">👑</div>
      <div class="lines" id="lines"></div>
      <div class="sep" id="sep1"></div>
      <div class="signature" id="signature">
        <span class="dash"></span>
        <span class="h-ico">💙</span>نرميين
      </div>
    </div>

    <!-- PHOTO BOX (RTL: shows on left) -->
    <div class="photo-col">
      <div class="photo-box" id="photoBox">
        <img src="photo.jpg" alt="الصورة">
      </div>
    </div>

  </div>
</div>

<script>
const hBg=document.getElementById('hearts-bg');
const hColors=['#4fb3d8','#7ec8e3','#a8d8f0','#e6c272','#cdeeff','#7ecfb0'];
function spawnHeart(){
  const h=document.createElement('div');h.className='heart';
  const s=6+Math.random()*15;h.style.width=s+'px';h.style.height=s+'px';
  h.style.left=Math.random()*100+'vw';
  const color=hColors[Math.floor(Math.random()*hColors.length)];
  const uid='h'+Math.random().toString(36).substr(2,7);h.id=uid;
  const st=document.createElement('style');
  st.textContent=`#${uid}::before,#${uid}::after{background:${color};}`;
  document.head.appendChild(st);
  const dur=7+Math.random()*8;
  h.style.animation=`floatUp ${dur}s linear forwards`;
  h.style.animationDelay=Math.random()*1.5+'s';
  hBg.appendChild(h);setTimeout(()=>{h.remove();st.remove();},(dur+2)*1000);
}
for(let i=0;i<20;i++)setTimeout(spawnHeart,i*280);
setInterval(spawnHeart,620);
function spawnStar(){
  const s=document.createElement('div');s.className='star-dot';
  const sz=1.5+Math.random()*3;s.style.width=sz+'px';s.style.height=sz+'px';
  s.style.left=Math.random()*100+'vw';s.style.top=Math.random()*100+'vh';
  s.style.animation=`starTwinkle ${1.8+Math.random()*2.5}s ease-in-out`;
  hBg.appendChild(s);setTimeout(()=>s.remove(),5000);
}
setInterval(spawnStar,350);

const bgMusic=document.getElementById('bgMusic');
const muteBtn=document.getElementById('muteBtn');
function tryPlayMusic(){
  bgMusic.volume=0.8;
  bgMusic.play().then(()=>{muteBtn.textContent='🔊';muteBtn.classList.add('playing');})
  .catch(()=>{muteBtn.textContent='🔇';});
}
function stopMusicGracefully(){
  let v=bgMusic.volume;
  const fo=setInterval(()=>{
    v-=0.05;
    if(v<=0){bgMusic.volume=0;bgMusic.pause();bgMusic.currentTime=0;muteBtn.textContent='🔇';muteBtn.classList.remove('playing');clearInterval(fo);}
    else bgMusic.volume=v;
  },80);
}
muteBtn.addEventListener('click',()=>{
  if(bgMusic.paused){bgMusic.play();muteBtn.textContent='🔊';muteBtn.classList.add('playing');}
  else{bgMusic.pause();muteBtn.textContent='🔇';muteBtn.classList.remove('playing');}
});

const PASSWORD="2752002";
const input=document.getElementById('pwInput');
const card=document.getElementById('card');
const reveal=document.getElementById('reveal');
const hint=document.getElementById('hint');
let unlocked=false;

input.addEventListener('input',()=>{
  if(unlocked)return;
  const v=input.value.trim();
  if(v.length>0&&!PASSWORD.startsWith(v)){
    input.classList.add('shake');hint.textContent='مش هي 🙈 جربي تاني';
    setTimeout(()=>input.classList.remove('shake'),450);return;
  }else{hint.textContent='';}
  if(v===PASSWORD){unlocked=true;unlockSequence();}
});
input.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&input.value.trim()===PASSWORD&&!unlocked){unlocked=true;unlockSequence();}
});

function burstParticles(){
  const icons=['👑','💙','✨','🌙','⭐','💚','🌟'];
  for(let i=0;i<36;i++){
    const b=document.createElement('div');b.className='burst-el';
    b.textContent=icons[Math.floor(Math.random()*icons.length)];
    const angle=Math.random()*2*Math.PI;const dist=100+Math.random()*260;
    b.style.setProperty('--tx',Math.cos(angle)*dist+'px');
    b.style.setProperty('--ty',Math.sin(angle)*dist-80+'px');
    b.style.setProperty('--rot',(Math.random()*360)+'deg');
    b.style.left='50vw';b.style.top='45vh';
    b.style.fontSize=(14+Math.random()*22)+'px';
    b.style.animation=`burstFly ${1.4+Math.random()*1.2}s ease-out forwards`;
    b.style.animationDelay=(Math.random()*.4)+'s';
    document.body.appendChild(b);setTimeout(()=>b.remove(),3400);
  }
}

function unlockSequence(){
  card.classList.add('hide');
  burstParticles();tryPlayMusic();
  setTimeout(()=>{
    reveal.classList.add('show');
    document.getElementById('photoBox').classList.add('show');
    typeLines();
  },600);
  setTimeout(burstParticles,1600);
  setTimeout(burstParticles,3000);
}

const messageLines=[
  {text:'قااالو... عنك .....الجمااال... في ...عنيكي ...بات ....👑',cls:'gold'},
  {text:'قااالو.... انك ....احلي..... من ....كل.... البناات.....',cls:'sky'},
  {text:'قااالو..... عنك .....الجمااال ....في ....عنيكي ...باااات.... 💚',cls:'green'},
  {text:'قااالو.... انك ...احلي... من... كل... البنااااات.....',cls:'sky'},
  {text:'و... أن ...حبك... سكه... شايكه ✨',cls:'star'},
  {text:'قالوو... فييكي ...من... الملاايكه........',cls:'gold'},
  {text:'روحت .....أشوفك .....وبصراحة .......... 🌙',cls:'sky'},
  {text:'فوقتي..... كل .....التوقعااااااااااااااات...!!!!!!',cls:'star'},

];

function typeLines(){
  const container=document.getElementById('lines');
  container.innerHTML='';let li=0;
  function nextLine(){
    if(li>=messageLines.length){
      setTimeout(()=>document.getElementById('sep1').classList.add('show'),5000);
      setTimeout(()=>document.getElementById('signature').classList.add('show'),1000);
      setTimeout(()=>stopMusicGracefully(),50000);
      return;
    }
    const{text,cls}=messageLines[li];
    const lineEl=document.createElement('div');lineEl.className='line '+cls;
    const txtEl=document.createElement('span');txtEl.className='txt';
    lineEl.appendChild(txtEl);container.appendChild(lineEl);
    setTimeout(()=>{document.getElementById('textCol').scrollTop=document.getElementById('textCol').scrollHeight;},50);
    let ci=0;const chars=Array.from(text);
    function typeChar(){
      if(ci<chars.length){txtEl.textContent+=chars[ci];ci++;setTimeout(typeChar,65);}
      else{setTimeout(()=>{txtEl.style.borderLeft='none';li++;nextLine();},280);}
    }
    typeChar();
  }
  nextLine();
}
</script>
</body>
</html>
